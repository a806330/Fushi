name: Dump x64 debug CRT

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: windows-2022
    steps:
      - name: Collect x64 debug CRT files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path crt -Force | Out-Null
          $found = @()
          Get-ChildItem "C:/Program Files/Microsoft Visual Studio" -Recurse -Directory -Filter "Microsoft.VC14*.DebugCRT" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            ForEach-Object { Copy-Item "$($_.FullName)/*" -Destination crt -Force; $found += $_.FullName }
          Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter "ucrtbased.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            ForEach-Object { Copy-Item $_.FullName -Destination crt -Force; $found += $_.FullName }
          $found | Out-File crt/found.txt
          Get-ChildItem crt | ForEach-Object { "$($_.Name) $($_.Length)" } | Out-File crt/listing.txt
          Write-Output "collected $($found.Count) source locations"
      - name: Upload CRT bundle
        uses: actions/upload-artifact@v4
        with:
          name: x64-debug-crt
          path: crt
          if-no-files-found: error
