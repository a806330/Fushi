name: Push build artifact to branch (split volumes, codeload-friendly)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source workflow run id that produced the artifact'
        required: true
        default: '41094115374'
      artifact_name:
        description: 'Artifact name to re-host'
        required: true
        default: 'win-x64-fushi-debug-bundle'
      artifact_id:
        description: 'Artifact id (used to skip name lookup)'
        required: true
        default: '12910168969'
      mode:
        description: 'kernel_blob = only Dart artifact + manifest (small/fast); full = whole bundle'
        required: true
        default: 'kernel_blob'

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download artifact via REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifact-download

          echo "===== diagnose: can this token list run artifacts? ====="
          curl -s -o /tmp/list.json -w "list HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/artifacts?name=${{ inputs.artifact_name }}" || true
          head -c 800 /tmp/list.json || true
          echo

          echo "===== download artifact zip by id ====="
          curl -sS -L --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ inputs.artifact_id }}/zip" \
            -o artifact.zip -w "download HTTP %{http_code} size=%{size_download}\n"

          ls -la artifact.zip
          echo "===== unzip ====="
          unzip -q artifact.zip -d artifact-download
          du -sh artifact-download
          echo "top level:"
          find artifact-download -maxdepth 1 -mindepth 1 -printf '%y %10s %p\n'

      - name: Package and push to orphan branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          cd artifact-download

          # 全量清单：即使只替换 kernel_blob，也能核对其余文件是否与本地一致
          find . -type f -printf '%s\t%p\n' | sort -k2 > ../manifest.txt
          echo "--- kernel_blob ---"
          sha256sum data/flutter_assets/kernel_blob.bin 2>/dev/null >> ../manifest.txt || true
          stat -c 'kernel_blob_bytes=%s' data/flutter_assets/kernel_blob.bin 2>/dev/null || true

          if [ "$MODE" = "kernel_blob" ]; then
            echo "packing kernel_blob only"
            7z a -v50m ../bundle.7z data/flutter_assets/kernel_blob.bin ../manifest.txt >/dev/null
          else
            echo "packing full bundle"
            7z a -v50m ../bundle.7z . >/dev/null
          fi

          cd ..
          echo "volumes:"; ls -la bundle.7z.*
          git init -b build-artifacts-win
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f bundle.7z.*
          git commit -m "re-host (${{ inputs.mode }}) from run ${{ inputs.run_id }}"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git push origin build-artifacts-win --force
          echo PUSHED build-artifacts-win
